# nginx vhost for the tacitus.md landing page (mirror of production).
# certbot adds the TLS blocks after: certbot --nginx -d tacitus.md -d www.tacitus.md
# Deploy: copy site/index.html to /var/www/tacitus.md/index.html
server {
    listen 80;
    server_name tacitus.md www.tacitus.md;
    root /var/www/tacitus.md;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
