# nginx vhost for the tacitus.md landing page (mirror of production).
# certbot adds the TLS blocks after: certbot --nginx -d tacitus.md -d www.tacitus.md
# Deploy: copy site/*.html and site/legal.css to /var/www/tacitus.md/
server {
    listen 80;
    server_name tacitus.md www.tacitus.md;
    root /var/www/tacitus.md;
    index index.html;

    # $uri.html so /terms, /privacy and /refunds work without the extension;
    # the .html URLs keep working too (they are what the pages link to).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
