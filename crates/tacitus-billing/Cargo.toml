[package]
name = "tacitus-billing"
description = "Stripe billing sidecar for Tacitus Sync Pro: Checkout redirect + webhook that rewrites entitlements.json per vault. No user accounts; the relay hot-reloads the file."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deployed via Docker next to the relay, not user installers.
[package.metadata.dist]
dist = false

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Webhook signature (HMAC-SHA256); Mac::verify_slice is constant-time, so no
# direct subtle dependency is needed.
hmac.workspace = true
# Blocking HTTP to api.stripe.com — always called behind spawn_blocking.
ureq.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
